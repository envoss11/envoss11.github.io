# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: "Eric Voss"
# Read by jekyll-feed for the <author> on every entry in /feed.xml.
author: "Eric Voss"
description: "Writing by Eric Voss on AI/ML, data science, and the books he reads."
url: "https://www.ericvoss.com"
baseurl: ""
locale: "en-US"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed

include:
  - _pages

# This replaces Jekyll's default exclude list rather than adding to it, so the
# defaults have to be named here too. Dotfiles and _-prefixed directories are
# skipped on their own.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - Makefile
  - README.md
  - CLAUDE.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: "_pages"
    values:
      layout: default
