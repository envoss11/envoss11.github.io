# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title: "Eric Voss"
name: "Eric Voss"
# Read by jekyll-feed for the <author> on every entry in /feed.xml.
author: "Eric Voss"
description: "Lead data scientist in St. Paul, Minnesota, working on enterprise AI standards and shared platform capabilities in financial services."
url: "https://www.ericvoss.com"
baseurl: ""
locale: "en-US"
github_username: envoss11
email: "envoss11@gmail.com"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  entity_output: as_char

sass:
  style: compressed

# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------
permalink: /:collection/:title/

collections:
  portfolio:
    output: true
    permalink: /projects/:path/

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - README.md
  - resume.docx
  - resume.pdf
  - Eric_Voss_Resume.pdf
  - .Rhistory
  - .DS_Store

keep_files:
  - .git

defaults:
  - scope:
      path: ""
      type: portfolio
    values:
      layout: project
  # The blog runs on plain posts rather than a second collection, so dates,
  # ordering, and the jekyll-feed RSS at /feed.xml all come for free. The
  # permalink override is what puts them under /blog/ instead of the
  # /:collection/:title/ above, which would resolve to /posts/.
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: default
