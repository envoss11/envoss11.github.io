# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: "Eric Voss"
author: "Eric Voss"
description: "Eric Voss: a home page and some writing."
url: "https://www.ericvoss.com"
baseurl: ""
locale: "en-US"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap

# The feed carries Writing. jekyll-feed always builds a posts feed too, so it is
# parked at a path nothing links to; Writing takes /feed.xml.
feed:
  path: /feed/posts.xml
  posts_limit: 20
  collections:
    writing:
      path: /feed.xml

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed

include:
  - _pages

collections:
  writing:
    output: true
    permalink: /writing/:title/

# This replaces Jekyll's default exclude list rather than adding to it, so the
# defaults have to be named here too.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - Makefile
  - README.md
  - CLAUDE.md
  - tools

defaults:
  - scope:
      path: ""
      type: writing
    values:
      layout: post
