# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: "Eric Voss"
# Read by jekyll-feed for the <author> on every entry in /feed.xml.
author: "Eric Voss"
description: "Eric Voss's notebook: notes on books, writing, and projects."
url: "https://www.ericvoss.com"
baseurl: ""
locale: "en-US"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap

# The feed carries Writing. jekyll-feed always builds a posts feed too, so it is
# parked at a path nothing links to; Writing takes /feed.xml.
feed:
  path: /feed/posts.xml
  posts_limit: 20
  collections:
    writing:
      path: /feed.xml

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed

include:
  - _pages

# Content lives in collections, one Markdown file per entry. `published: false`
# in front matter keeps an entry out of a production build; `make serve`
# passes --unpublished to show it.
collections:
  books:
    output: true
    permalink: /reading/:title/
  writing:
    output: true
    permalink: /writing/:title/
  projects:
    output: true
    permalink: /projects/:title/

# This replaces Jekyll's default exclude list rather than adding to it, so the
# defaults have to be named here too. Dotfiles and _-prefixed directories are
# skipped on their own.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - Makefile
  - README.md
  - CLAUDE.md
  - tools
  - .venv

defaults:
  - scope:
      path: ""
      type: books
    values:
      section: reading
      layout: book
  - scope:
      path: ""
      type: writing
    values:
      section: writing
      layout: entry
  - scope:
      path: ""
      type: projects
    values:
      section: projects
      layout: entry
  - scope:
      path: "_pages"
    values:
      layout: notebook
