# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title: "Eric Voss"
name: "Eric Voss"
# Read by jekyll-feed for the <author> on every entry in /feed.xml.
author: "Eric Voss"
description: "Lead data scientist in St. Paul, Minnesota, working on enterprise AI standards and shared platform capabilities in financial services."
url: "https://www.ericvoss.com"
baseurl: ""
locale: "en-US"
github_username: envoss11
email: "envoss11@gmail.com"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
encoding: "utf-8"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  entity_output: as_char

sass:
  style: compressed

# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------
permalink: /:collection/:title/

collections:
  portfolio:
    output: true
    permalink: /projects/:path/

include:
  - _pages

# This replaces Jekyll's default exclude list rather than adding to it, so the
# toolchain files have to be named here too. Anything starting with a dot
# (.github, .bundle, .jekyll-cache) Jekyll already skips on its own.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - Makefile
  - README.md

defaults:
  - scope:
      path: ""
      type: portfolio
    values:
      layout: project
  # The blog runs on plain posts rather than a second collection, so dates,
  # ordering, and the jekyll-feed RSS at /feed.xml all come for free. The
  # permalink override is what puts them under /blog/ instead of the
  # /:collection/:title/ above, which would resolve to /posts/.
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: default
