{%- comment -%} A row of small covers. Pass `books`. The title shows on hover and is the image's alt text. {%- endcomment -%}
<ul class="shelf">
  {%- for book in include.books %}
  {%- assign name = book.title | split: ":" | first %}
  <li>
    <a href="{{ book.url | relative_url }}" title="{{ name | escape }} — {{ book.author | escape }}">
      {%- if book.cover %}
      <img src="{{ book.cover | relative_url }}" alt="{{ name | escape }}, {{ book.author | escape }}" width="280" height="425" loading="lazy">
      {%- else %}
      <span class="cover-blank">{{ name }}</span>
      {%- endif %}
    </a>
  </li>
  {%- endfor %}
</ul>
