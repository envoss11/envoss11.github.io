{%- comment -%} One section of the feed. Pass heading, key, and posts. {%- endcomment -%}
<section class="feed-section" id="{{ include.key }}" data-topic="{{ include.key }}" aria-labelledby="h-{{ include.key }}">
  <h2 id="h-{{ include.key }}">{{ include.heading }}</h2>
  {%- if include.posts.size > 0 %}
  <ul class="post-list">
    {%- for post in include.posts %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {%- endfor %}
  </ul>
  {%- else %}
  <p class="empty">Nothing yet.</p>
  {%- endif %}
</section>
