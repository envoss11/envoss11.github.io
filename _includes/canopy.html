{%- comment -%}
Decorative canopy overhead — leaves reaching in from the top edge of the
viewport. Purely ornamental, so it is hidden from assistive tech.
{%- endcomment -%}
<div class="canopy" aria-hidden="true">
  <svg viewBox="0 0 1440 300" preserveAspectRatio="xMidYMin slice" role="presentation" focusable="false">
    <defs>
      <g id="leaf">
        <path d="M0,0 C7,-9.5 19,-10.5 26,0 C19,10.5 7,9.5 0,0 Z"/>
        <path d="M3,0 L23,0" fill="none" stroke="rgba(246,243,233,.55)" stroke-width="1"/>
      </g>
    </defs>

    <g class="canopy-branches">
      <path d="M-30,6 C 110,34 220,6 330,62" />
      <path d="M-20,-12 C 90,10 170,52 250,44" />
      <path d="M1470,2 C 1330,34 1230,10 1120,70" />
      <path d="M1460,-14 C 1360,14 1290,56 1210,46" />
      <path d="M712,-24 C 736,26 676,58 706,112" />
    </g>

    <!-- left cluster -->
    <g class="canopy-cluster canopy-cluster--a">
      <use href="#leaf" class="leaf-a" transform="translate(-6,4) rotate(28) scale(1.5)"/>
      <use href="#leaf" class="leaf-b" transform="translate(44,-8) rotate(64) scale(1.25)"/>
