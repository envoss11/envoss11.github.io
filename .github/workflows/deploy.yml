name: Deploy site

# Replaces GitHub Pages' legacy "Deploy from a branch" builder, which pinned
# Jekyll 3.10 and reported failures by email. Building here means Jekyll 4, any
# plugin, and a real log.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source must be
# set to "GitHub Actions". Until that flip the legacy builder still serves the
# site, however green this workflow runs.

# One workflow, not two. A separate PR-check workflow would duplicate the build
# steps, and any drift between the copies would let a change pass the check and
# then fail the deploy. Instead the same job runs on both events and the
# publishing half is gated off for pull requests.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No ruby-version here on purpose: setup-ruby's default already reads
      # .ruby-version, and there is no `ruby-version-file` input to point at it
      # — passing one is ignored with a warning.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      # --disable-external on purpose: a third-party outage should not be able
      # to fail a deploy. Check outbound links on demand instead.
      - name: Check output
        run: bundle exec htmlproofer ./_site --disable-external

      # A pull request stops here: build and link check, no artifact, no
      # deploy. That is the whole check — a green tick before the merge.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Scoped to this job rather than the workflow: at the top it would serialize
    # every PR check against the same `pages` group for no reason. Let a running
    # deploy finish rather than cancelling it mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
