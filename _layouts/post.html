---
layout: default
---
<article class="post">
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      {%- for key in page.topics -%}
        {%- assign topic = site.data.topics | where: "key", key | first -%}
        {%- if topic %} · <a href="{{ '/' | relative_url }}#{{ topic.key }}">{{ topic.label }}</a>{% endif -%}
      {%- endfor -%}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
