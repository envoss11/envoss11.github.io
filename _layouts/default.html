<!doctype html>
<html lang="{{ site.locale }}">
  <head>
    {%- include head.html %}
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="Main">
          {%- for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}"{% if item.url contains '://' %} rel="noopener"{% elsif page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          {%- endfor %}
        </nav>
      </header>
      <main id="main">
        {{ content }}
      </main>
      <footer class="site-footer">
        {%- unless page.url == "/" %}
        <a href="{{ '/' | relative_url }}">← Back home</a>
        {%- endunless %}
        <span>© {{ site.time | date: "%Y" }} {{ site.author }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
      </footer>
    </div>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
