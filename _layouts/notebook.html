<!doctype html>
<html lang="{{ site.locale }}">
  <head>
    {%- include head.html %}
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {%- include tabs.html %}
      </header>
      <main id="main">
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>
          {%- for link in site.data.notebook.links %}<a href="{{ link.url }}" rel="noopener">{{ link.title }}</a>{% unless forloop.last %} · {% endunless %}{% endfor -%}
        </span>
        <span>© {{ site.time | date: "%Y" }} {{ site.author }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
      </footer>
    </div>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
