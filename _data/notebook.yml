# The notebook's sections, in tab order. `collection` is the key in
# _config.yml; `url` is the section's index page.
tabs:
  - key: reading
    label: Reading
    url: /reading/
    collection: books
  # Not a collection: the blockquotes in Reading's notes, gathered.
  - key: excerpts
    label: Excerpts
    url: /excerpts/
  - key: writing
    label: Writing
    url: /writing/
    collection: writing

# Links to elsewhere, shown in the footer.
links:
  - title: LinkedIn
    url: https://www.linkedin.com/in/eric-n-voss/
  - title: GitHub
    url: https://github.com/envoss11/
  - title: X
    url: https://x.com/VossEricN
