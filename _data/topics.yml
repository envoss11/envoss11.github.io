# The filters on the homepage, in the order they appear. A post opts in with
# `topics: [<key>]` in its front matter; the key is also the URL hash, so
# /#books opens the feed filtered to book notes.
#
# "All" and "Other" are not listed here. Other is whatever is left over: a post
# with no topics, or none that match a key below. `make post` checks TOPIC
# against this file so a typo fails instead of landing in Other.
- key: ai-ml
  label: AI/ML
  heading: AI and machine learning
- key: data-science
  label: Data Science
  heading: Data science
- key: books
  label: Book notes
  heading: Book notes
