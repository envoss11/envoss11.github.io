# Smaller pieces of work that don't have a full write-up of their own.
#
# Renders as the collapsible "Other analyses & coursework" list at the bottom
# of /posts/, under the works-in-progress drawer. Each row takes:
#
#   name        required — the heading on the row
#   tag         optional — the small pill beside the name, e.g. "Python · SQL"
#   description required — one or two sentences, no link
#
# The whole section is hidden when this file has no entries.

- name: "Placeholder — Archive Entry"
  tag: "Tool · Method"
  description: "Placeholder copy. One or two sentences on what the analysis was and what came out of it. These rows are for work that is worth listing but does not need a page of its own."

- name: "Placeholder — Second Archive Entry"
  description: "Placeholder copy. This row has no tag, to show that the pill is optional and the layout closes up without it."
